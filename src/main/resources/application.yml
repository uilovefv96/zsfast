  # 1. Swagger UI ?????
  # ???????????http://localhost:8080/swagger-ui/index.html
  swagger-ui:
    path: /swagger-ui.html

  # 2. ???? (OpenAPI JSON) ?????
  api-docs:
    path: /v3/api-docs

  # 3. ???????????Tags??????????
  tags-sorter: alpha
  # 4. ????????????????
  operations-sorter: alpha