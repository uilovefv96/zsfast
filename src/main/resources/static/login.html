<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员登录</title>
    <style>
        body {
            margin: 0;
            background: #f0f2f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            width: 360px;
            background: #fff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-box h2 {
            margin-bottom: 30px;
            color: #333;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #409eff;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 10px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #337ecc;
        }
        .error-msg {
            color: #f56c6c;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>物流后台 · 管理员登录</h2>
    <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="input-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入管理员账号" required>
        </div>
        <div class="input-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="login-btn">登 录</button>
        <div id="errorMsg" class="error-msg"></div>
    </form>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorEl = document.getElementById('errorMsg');

        if (!username || !password) {
            errorEl.textContent = '请输入完整信息';
            return false;
        }

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
            });

            if (res.redirected) {
                // 后端重定向到 /admin.html，浏览器自动跟随
                window.location.href = res.url;
            } else {
                const text = await res.text();
                errorEl.textContent = text || '登录失败，请检查账号密码';
            }
        } catch (err) {
            errorEl.textContent = '网络错误，请稍后重试';
            console.error(err);
        }
        return false;
    }
</script>
</body>
</html>
